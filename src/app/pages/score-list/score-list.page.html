<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Annonces</ion-title>
    <ion-buttons slot="end">
      <app-tone-segment [compact]="!isToggleButtonOk()"></app-tone-segment>
      <ion-button (click)="openModal()" aria-label="Historique">
        <ion-icon slot="icon-only" src="assets/icon/history.svg"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="score-list">
    @for (score of scores(); track score.id) {
    <article class="score-card">
      <div class="score-card__header">
        <div class="score-card__heading">
          <h2 class="score-card__title">
            <span class="number-chip">{{ score.number }}</span>
            <span class="score-card__name">{{ score.title }}</span>
          </h2>
          <p class="score-card__meta">{{ getScoreMeta(score.id) }}</p>
        </div>
        <div class="score-card__actions">
          <ion-button
            class="tonal-button"
            shape="round"
            (click)="removeScoreFromHistory(score.id)"
            aria-label="Retirer une annonce"
          >
            <ion-icon slot="icon-only" name="remove"></ion-icon>
          </ion-button>
          <ion-badge
            class="count-badge"
            [style.background-color]="getBadgeBackgroundColor(getTodayOccurrences(score.id))"
            [style.color]="getBadgeTextColor(getTodayOccurrences(score.id))"
            [attr.aria-label]="getTodayLabel(score.id)"
          >
            {{ getTodayOccurrences(score.id) }}
          </ion-badge>
          <ion-button
            class="tonal-button"
            shape="round"
            (click)="addScoreToHistory(score.id, score.title, score.number)"
            aria-label="Ajouter une annonce"
          >
            <ion-icon slot="icon-only" name="add"></ion-icon>
          </ion-button>
        </div>
      </div>
      <app-music-display [score]="score"></app-music-display>
    </article>
    }
  </div>
</ion-content>
