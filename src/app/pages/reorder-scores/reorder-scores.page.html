<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Ordre des annonces</ion-title>
    <ion-buttons slot="end">
      @if (!isOrderOriginal()) {
      <ion-button (click)="resetOrder()" aria-label="Réinitialiser l'ordre">
        <ion-icon slot="icon-only" src="assets/icon/restart.svg"></ion-icon>
      </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <p class="reorder-hint">Glissez les poignées pour changer l'ordre.</p>
  <ion-list class="gillou-list reorder-list" lines="inset">
    <ion-reorder-group (ionItemReorder)="reorderScores($event)" disabled="false">
      @for (id of order(); track id) {
      <ion-item>
        <span class="number-chip" slot="start">{{ getScoreIdentifierById(id)?.number }}</span>
        <ion-label>{{ getScoreIdentifierById(id)?.title }}</ion-label>
        <ion-reorder slot="end"></ion-reorder>
      </ion-item>
      }
    </ion-reorder-group>
  </ion-list>
</ion-content>
