<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Historique</ion-title>
    <ion-buttons slot="end">
      @if (!isHistoryEmpty()) {
      <ion-button (click)="saveAsCarnival()" aria-label="Enregistrer comme carnaval">
        <ion-icon slot="icon-only" src="assets/icon/save.svg"></ion-icon>
      </ion-button>
      <ion-button (click)="deleteHistory()" aria-label="Tout effacer">
        <ion-icon slot="icon-only" src="assets/icon/delete.svg"></ion-icon>
      </ion-button>
      }
      <ion-button (click)="cancel()" aria-label="Fermer">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <app-score-history-display></app-score-history-display>
</ion-content>
