<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-content>
        <div class="menu-header">
          <div class="menu-logo">
            <ion-img src="assets/icon/gillou.png" alt=""></ion-img>
          </div>
          <h1 class="menu-title">Gillou</h1>
          <p class="menu-subtitle">Annonces du carnaval</p>
        </div>
        <ion-list id="menu-list" lines="none">
          @for (p of appPages; track p.url) {
          <ion-menu-toggle auto-hide="false">
            <ion-item
              routerDirection="root"
              [routerLink]="[p.url]"
              detail="false"
              routerLinkActive="selected"
            >
              <ion-icon [src]="p.icon" aria-hidden="true"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
      <ion-footer class="menu-footer ion-no-border">
        <app-brand-footer></app-brand-footer>
      </ion-footer>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
